# Whole application with one command:  docker compose up --build
# Frontend: http://localhost:8080   API: http://localhost:3000/api   Swagger: http://localhost:3000/api/docs
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: restomenago
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restomenago"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./server
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/restomenago
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file next to docker-compose.yml}
      JWT_EXPIRES_IN: 8h
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
