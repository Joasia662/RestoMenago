<h1>Menu</h1>

<form class="add" (ngSubmit)="create()">
  <input name="name" placeholder="Nazwa dania" [(ngModel)]="name" required />
  <select name="category" [(ngModel)]="category">
    @for (c of categories; track c) {
      <option [value]="c">{{ categoryLabels[c] }}</option>
    }
  </select>
  <input name="price" type="number" min="0" step="0.5" placeholder="Cena" [(ngModel)]="price" required />
  <button type="submit" [disabled]="!name || price === null">Dodaj danie</button>
</form>

@if (error()) {
  <p class="error">{{ error() }}</p>
}

<table>
  <thead>
    <tr>
      <th>Zdjęcie</th>
      <th>Nazwa</th>
      <th>Kategoria</th>
      <th>Cena</th>
      <th>Dostępne</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (item of items(); track item.id) {
      <tr [class.unavailable]="!item.isAvailable">
        <td>
          <div class="photo">
          @if (item.imageUrl) {
            <img [src]="item.imageUrl" [alt]="item.name" />
          } @else {
            <span class="no-photo">brak</span>
          }
          <div class="photo-actions">
            <label class="upload">
              {{ item.imageUrl ? 'Zmień' : 'Dodaj zdjęcie' }}
              <input type="file" accept="image/png,image/jpeg,image/webp" (change)="uploadImage(item, $event)" />
            </label>
            @if (item.imageUrl) {
              <button class="secondary small" (click)="removeImage(item)">Usuń</button>
            }
          </div>
          </div>
        </td>
        <td>{{ item.name }}</td>
        <td>{{ categoryLabels[item.category] }}</td>
        <td>{{ item.price.toFixed(2) }} zł</td>
        <td>
          <button class="secondary" (click)="toggle(item)">
            {{ item.isAvailable ? 'Tak (wycofaj)' : 'Nie (przywróć)' }}
          </button>
        </td>
        <td><button class="danger" (click)="remove(item)">Usuń</button></td>
      </tr>
    }
  </tbody>
</table>
