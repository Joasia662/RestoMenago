@if (error()) {
  <p class="error">{{ error() }}</p>
}

<div class="layout">
  <section class="tables">
    <app-table-grid
      [tables]="tables()"
      [activeOrders]="activeOrders()"
      [selectedId]="selectedTableId()"
      (selected)="selectedTableId.set($event)"
      (changed)="load()"
    />
  </section>

  <aside class="panel">
    @if (selectedTable(); as table) {
      <app-order-panel
        [table]="table"
        [orderId]="activeOrders()[table.id]?.id ?? null"
        (changed)="load()"
        (closed)="selectedTableId.set(null)"
      />
    } @else {
      <div class="placeholder">
        <h2>Zamówienie</h2>
        <p>Kliknij stolik, żeby otworzyć albo obsłużyć zamówienie.</p>
      </div>
    }
  </aside>
</div>
