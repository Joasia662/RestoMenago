server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API requests go to the backend service from docker-compose.yml
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
    }

    # Angular routes (/login, /admin/menu) are handled by the app itself
    location / {
        try_files $uri $uri/ /index.html;
    }
}
